name: Cypress Tests (pnpm)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # Usamos o seu script do package.json para garantir que o posttest rode
          command: pnpm test
          browser: electron
        continue-on-error: true # Importante: permite que a pipeline continue para gerar o report mesmo se um teste falhar

      - name: Upload Report Artifact
        if: always() # Garante que o relatório seja salvo mesmo se os testes falharem
        uses: actions/upload-artifact@v4
        with:
          name: cypress-html-report
          path: cypress/reports/html
          retention-days: 30

      - name: Upload Screenshots (Failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots